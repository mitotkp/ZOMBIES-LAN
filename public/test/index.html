<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZOMBIES LAN · Sala de pruebas</title>
  <style>
    :root { --bg: rgba(14, 12, 12, 0.88); --line: #3a2a2a; --txt: #e8e0d6; --dim: #9a8f84; --acc: #c8312c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0b0b; color: var(--txt);
      font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; }
    #view { position: fixed; inset: 0; }
    #panel { position: fixed; top: 10px; left: 10px; bottom: 10px; width: 300px; overflow-y: auto; padding: 12px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px; z-index: 2; }
    #panel.hidden { display: none; }
    h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.04em; color: #fff; }
    .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
    fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 10px; padding: 8px 9px 9px; }
    legend { padding: 0 4px; color: #f0b0a0; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    label.row { justify-content: space-between; }
    select, input[type=range] { width: 100%; }
    select { background: #1d1818; color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
    .btns.three { grid-template-columns: 1fr 1fr 1fr; }
    button { background: #2a1f1f; color: var(--txt); border: 1px solid #4a3434; border-radius: 4px; padding: 6px 4px;
      cursor: pointer; font: inherit; }
    button:hover { background: #3a2828; }
    button.on { background: var(--acc); border-color: #e4574f; color: #fff; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
    .val { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
    #status { font-size: 12px; color: var(--dim); margin-top: 4px; min-height: 1.3em; }
    #toggle { position: fixed; top: 10px; right: 10px; z-index: 3; }
    #help { position: fixed; right: 10px; bottom: 10px; z-index: 2; color: var(--dim); font-size: 12px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; max-width: 320px; }
    .only-weapons, .only-models { display: none; }
    body.m-weapons .only-weapons, body.m-models .only-models { display: block; }
    @media (max-width: 640px) { #panel { width: auto; right: 10px; bottom: 45%; } #help { display: none; } }
  </style>
  <script type="importmap">
  { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body class="m-weapons">
  <div id="view"></div>
  <button id="toggle">Ocultar panel</button>
  <div id="panel">
    <h1>SALA DE PRUEBAS</h1>
    <div class="sub">Armas, animaciones y modelos sin entrar en partida.</div>
    <div class="tabs">
      <button id="tab-weapons" class="on">Armas y manos</button>
      <button id="tab-models">Modelos</button>
    </div>

    <div class="only-weapons">
      <fieldset>
        <legend>Arma</legend>
        <select id="weapon"></select>
        <label><input type="checkbox" id="pap"> Mejorada (Pack-a-Punch)</label>
      </fieldset>
      <fieldset>
        <legend>Cámara</legend>
        <div class="btns three">
          <button data-cam="fp" class="on">1.ª persona</button>
          <button data-cam="side">Lateral</button>
          <button data-cam="free">Libre</button>
        </div>
        <label><input type="checkbox" id="world" checked> Fondo con escenario</label>
      </fieldset>
      <fieldset>
        <legend>Acciones</legend>
        <div class="btns">
          <button id="a-fire">Disparar</button>
          <button id="a-reload">Recargar</button>
          <button id="a-knife">Cuerpo a cuerpo</button>
          <button id="a-throw">Granada</button>
          <button id="a-drink">Beber (antídoto)</button>
          <button id="a-perk">Beber ventaja</button>
          <button id="a-bandage">Venda</button>
          <button id="a-medkit">Botiquín</button>
          <button id="a-shield">Escudo</button>
          <button id="a-bash">Golpe de escudo</button>
        </div>
        <label style="margin-top:8px">Arma cuerpo a cuerpo <select id="melee" style="width:auto;flex:1"></select></label>
        <label><input type="checkbox" id="empty"> Recarga con el cargador vacío</label>
        <label><input type="checkbox" id="auto"> Disparo automático</label>
      </fieldset>
      <fieldset>
        <legend>Movimiento</legend>
        <label><input type="checkbox" id="ads"> Apuntar (ADS)</label>
        <label><input type="checkbox" id="walk"> Caminar</label>
        <label><input type="checkbox" id="sprint"> Correr</label>
        <label><input type="checkbox" id="crouch"> Agacharse</label>
        <label><input type="checkbox" id="down"> Derribado</label>
      </fieldset>
      <fieldset>
        <legend>Línea de tiempo</legend>
        <label class="row">Velocidad <span class="val" id="speed-v">1.00×</span></label>
        <input type="range" id="speed" min="0.05" max="2" step="0.05" value="1">
        <label><input type="checkbox" id="freeze"> Congelar la acción en:</label>
        <label class="row"><input type="range" id="scrub" min="0" max="1" step="0.005" value="0.5"><span class="val" id="scrub-v">0.50</span></label>
        <div id="status"></div>
      </fieldset>
    </div>

    <div class="only-models">
      <fieldset>
        <legend>Modelo</legend>
        <select id="model"></select>
        <label><input type="checkbox" id="row"> Mostrar todos en fila</label>
      </fieldset>
      <fieldset>
        <legend>Animación (zombis)</legend>
        <select id="anim"></select>
        <label class="row">Velocidad de marcha <span class="val" id="mspeed-v">1.0</span></label>
        <input type="range" id="mspeed" min="0" max="6" step="0.1" value="1">
        <div class="btns"><button id="z-hit">Impacto</button><button id="z-attack">Golpe</button><button id="z-death">Morir</button><button id="z-reset">Reiniciar</button></div>
        <div class="btns"><button id="z-ability" style="grid-column: span 2">Habilidad del jefe</button></div>
        <label><input type="checkbox" id="fuse"> Mecha encendida (explosivo)</label>
        <label><input type="checkbox" id="cloak"> Camuflaje (Espectro)</label>
      </fieldset>
      <fieldset>
        <legend>Jugador</legend>
        <label class="row">Arma del jugador <select id="pweapon" style="width:auto;max-width:60%"></select></label>
        <label><input type="checkbox" id="pcrouch"> Agachado</label>
        <label><input type="checkbox" id="pads"> Apuntando</label>
        <label><input type="checkbox" id="pdown"> Derribado</label>
        <label><input type="checkbox" id="ptorch"> Linterna</label>
      </fieldset>
    </div>
  </div>
  <div id="help">Arrastra para girar la cámara (vista libre y modelos), rueda para acercar. Esta página no se conecta a la partida.</div>
  <script type="module" src="/js/testroom.js"></script>
</body>
</html>
